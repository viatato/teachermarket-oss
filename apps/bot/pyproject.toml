[project]
name = "teachermarket-bot"
version = "0.1.0"
description = "Telegram bot for Teachermarket"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.7.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.2.1"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]
