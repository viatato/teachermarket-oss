services:
  postgres:
    image: postgres:16-alpine
    container_name: teachermarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teachermarket
      POSTGRES_USER: teachermarket
      POSTGRES_PASSWORD: teachermarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teachermarket -d teachermarket"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    profiles: ["app"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://teachermarket:teachermarket@postgres:5432/teachermarket
      API_BASE_URL: http://localhost:8000
      WEBAPP_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOCAL_STORAGE_PATH: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - local_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: ./apps/bot
    profiles: ["app"]
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

  webapp:
    build:
      context: ./apps/webapp
    profiles: ["app"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  local_storage:
