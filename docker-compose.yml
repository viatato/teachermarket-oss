services:
  postgres:
    image: postgres:16-alpine
    container_name: teachermarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teachermarket
      POSTGRES_USER: teachermarket
      POSTGRES_PASSWORD: teachermarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teachermarket -d teachermarket"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    profiles: ["app"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://teachermarket:teachermarket@postgres:5432/teachermarket
      API_BASE_URL: http://localhost:8000
      WEBAPP_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: /data/storage
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-teachermarket}
      S3_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "8000:8000"
    volumes:
      - local_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: ./apps/bot
    profiles: ["app"]
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

  webapp:
    build:
      context: ./apps/webapp
    profiles: ["app"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-teachermarket_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["minio"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-teachermarket_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_minio_password}
      S3_BUCKET: ${S3_BUCKET:-teachermarket}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"

volumes:
  postgres_data:
  local_storage:
  minio_data:
