<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3 концепти сайту · граніт</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3efe3;color:#19382f}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:min(1420px,calc(100% - 36px));margin:auto}.ey{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:900}.top{padding:52px 0 28px;border-bottom:1px solid #d1c9b7}.top .ey{color:#bd5f3f}.top h1{font:500 clamp(48px,7vw,98px)/.92 Georgia,serif;letter-spacing:-.055em;margin:16px 0 20px;max-width:1100px}.top p{max-width:760px;font-size:18px;line-height:1.6;color:#667168}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:28px 0 60px}.card{background:#fffaf0;border:1px solid #d8cfbc;overflow:hidden}.preview{height:480px;overflow:hidden;border-bottom:1px solid #d8cfbc;background:white}.mini{width:1420px;height:1100px;transform:scale(.34);transform-origin:0 0}.meta{padding:21px}.meta small{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#9c694d}.line{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:8px 0 12px}.line h2{margin:0;font:500 28px/1 Georgia,serif}.price{font-size:28px;font-weight:900;color:#2f6b4b}.meta p{color:#69736b;line-height:1.55;min-height:70px}.open{width:100%;height:46px;border:0;background:#173d32;color:white;font-weight:900;cursor:pointer}.site{height:100%;overflow:auto;background:var(--bg);color:var(--ink)}.site *{box-sizing:border-box}.site .shell{width:min(1180px,calc(100% - 36px));margin:auto}.site header{height:76px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--head);position:sticky;top:0;z-index:2}.hdr{display:flex;align-items:center;width:100%;gap:26px}.brand{font-weight:900;letter-spacing:.05em}.nav{margin-left:auto;display:flex;gap:20px;font-size:13px;font-weight:800}.cta{padding:12px 15px;background:var(--accent);color:var(--accentText);font-size:12px;font-weight:900}.hero{padding:48px 0 54px;background:var(--hero)}.heroGrid{display:grid;grid-template-columns:1.02fr .98fr;gap:42px;align-items:center}.hero h1{font:500 clamp(46px,5.5vw,76px)/.98 Georgia,serif;letter-spacing:-.045em;margin:13px 0 18px}.hero p{max-width:620px;line-height:1.65;color:var(--muted);font-size:16px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;align-items:center;padding:13px 16px;border:1px solid var(--accent);font-size:12px;font-weight:900}.btn.primary{background:var(--accent);color:var(--accentText)}.visual{height:480px;background:linear-gradient(145deg,var(--stone1),var(--stone2));position:relative;overflow:hidden;border:1px solid var(--line)}.visual:before{content:"";position:absolute;left:8%;right:8%;bottom:9%;height:34%;background:repeating-linear-gradient(90deg,#ffffff22 0 2px,transparent 2px 78px),linear-gradient(180deg,#ffffff14,#0002);transform:skewY(-7deg)}.visual:after{content:"";position:absolute;width:44%;height:72%;right:8%;top:8%;background:linear-gradient(145deg,#111,#555);box-shadow:0 35px 70px #0005}.caption{position:absolute;left:16px;bottom:16px;z-index:1;background:var(--tag);color:var(--tagText);padding:12px 14px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.stats div{padding:17px;border-right:1px solid var(--line)}.stats b{display:block}.stats span{font-size:11px;color:var(--muted)}.section{padding:68px 0}.alt{background:var(--soft)}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:25px}.sectionHead h2{font:500 40px/1 Georgia,serif;margin:7px 0 0}.sectionHead p{max-width:470px;color:var(--muted);line-height:1.55;font-size:13px}.cats,.products,.materials{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cat,.product,.material{background:var(--panel);border:1px solid var(--line)}.thumb{aspect-ratio:1.12;background:linear-gradient(145deg,#777,#191919);position:relative}.thumb:after{content:"";position:absolute;inset:16% 18%;background:linear-gradient(145deg,#1b1b1b,#565656);clip-path:polygon(10% 0,100% 0,86% 100%,0 100%)}.cat:nth-child(2) .thumb,.product:nth-child(2) .thumb{background:linear-gradient(145deg,#b7b7b0,#54585a)}.cat:nth-child(3) .thumb,.product:nth-child(3) .thumb{background:linear-gradient(145deg,#956756,#3e2420)}.cat:nth-child(4) .thumb,.product:nth-child(4) .thumb{background:linear-gradient(145deg,#d4cdb8,#757c73)}.copy{padding:13px}.copy h3{font:500 22px/1.1 Georgia,serif;margin:0 0 6px}.copy p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.prodFoot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:12px;font-size:12px}.prodFoot strong{font-size:14px}.material{padding:17px}.sw{height:85px;background:linear-gradient(145deg,#222,#050505);margin-bottom:12px}.material:nth-child(2) .sw{background:linear-gradient(145deg,#c1c3be,#6c7272)}.material:nth-child(3) .sw{background:linear-gradient(145deg,#a66b56,#49271f)}.material:nth-child(4) .sw{background:linear-gradient(145deg,#ded7bf,#888b78)}.quote{padding:34px;background:var(--quote);color:var(--quoteText);display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.quote h2{font:500 38px/1 Georgia,serif;margin:6px 0 12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{height:42px;border:1px solid currentColor;opacity:.85;padding:12px}.send{grid-column:1/-1;height:44px;border:0;background:var(--quoteBtn);color:var(--quoteBtnText);font-weight:900}.v700{--bg:#fffdf7;--head:#fffdf7;--hero:#f7f1d8;--soft:#f1edde;--panel:#fffef9;--ink:#26362c;--muted:#69776d;--line:#d6ddcf;--accent:#2d7048;--accentText:#fff;--tag:#e69c34;--tagText:#1b2d20;--stone1:#5f665f;--stone2:#171a17;--quote:#2d7048;--quoteText:#fff;--quoteBtn:#fff;--quoteBtnText:#2d7048}.v900{--bg:#fbf5e8;--head:#fbf5e8;--hero:#eadcc4;--soft:#efe5d3;--panel:#fff9ef;--ink:#223d31;--muted:#786f61;--line:#d5cbb9;--accent:#2b6048;--accentText:#fffaf0;--tag:#c66c49;--tagText:#fff;--stone1:#8a7f70;--stone2:#282622;--quote:#2b6048;--quoteText:#fff;--quoteBtn:#f0b586;--quoteBtnText:#263e34}.v1500{--bg:#f5efd9;--head:#14392f;--hero:#173d32;--soft:#214a3f;--panel:#fff9ed;--ink:#19362d;--muted:#6d756e;--line:#d4cbb3;--accent:#d84931;--accentText:#fff;--tag:#f2c842;--tagText:#17382f;--stone1:#52574e;--stone2:#0b0e0b;--quote:#f0c742;--quoteText:#17382f;--quoteBtn:#173d32;--quoteBtnText:#fff}.v1500 header{color:#fff;border-color:#386358}.v1500 .hero{color:#fff}.v1500 .hero p{color:#c4d1ca}.v1500 .alt{color:#fff}.v1500 .alt .sectionHead p,.v1500 .alt .copy p{color:#c4d1ca}.v1500 .alt .cat{background:#2a5649;border-color:#477367}.v1500 .nav{color:#fff}.modal{position:fixed;inset:0;background:#0d1714;z-index:50;display:none}.modal.on{display:block}.modalbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff}.modalbar button{height:34px;border:0;background:#f0c742;color:#17382f;padding:0 14px;font-weight:900}.full{height:calc(100vh - 54px)}@media(max-width:1000px){.cards{grid-template-columns:1fr}.preview{height:430px}.mini{transform:scale(.43)}.heroGrid,.quote{grid-template-columns:1fr}.cats,.products,.materials{grid-template-columns:repeat(2,1fr)}.nav{display:none}}@media(max-width:600px){.wrap{width:min(100% - 20px,1420px)}.top{padding-top:34px}.preview{height:320px}.mini{transform:scale(.27)}.section{padding:48px 0}.sectionHead{align-items:start;flex-direction:column}.cats,.products,.materials{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.send{grid-column:auto}}
</style>
</head><body>
<section class="top"><div class="wrap"><div class="ey">Комерційна пропозиція · 3 концепти</div><h1>Сайт виробника гранітної продукції</h1><p>Три різні рівні одного продукту: від прямого каталогу в логіці референсу до повної системи продажів. Кожен концепт можна відкрити окремо на весь екран.</p></div></section>
<div class="wrap cards" id="cards"></div>
<div class="modal" id="modal"><div class="modalbar"><b id="modalTitle">Концепт</b><button onclick="closeSite()">Закрити ×</button></div><div class="full" id="full"></div></div>
<script>
function site(cls,title,price,sub,heroTitle,heroText){
return `<div class="site ${cls}"><header><div class="shell hdr"><div class="brand">ГРАНІТ.</div><nav class="nav"><a>Каталог</a><a>Матеріали</a><a>Проєкти</a><a>Доставка</a></nav><a class="cta">Розрахувати</a></div></header>
<section class="hero"><div class="shell heroGrid"><div><div class="ey">${sub}</div><h1>${heroTitle}</h1><p>${heroText}</p><div class="actions"><a class="btn primary">Дивитися каталог</a><a class="btn">Запитати ціну</a></div></div><div class="visual"><div class="caption">Натуральний камінь · виробник</div></div></div></section>
<div class="shell stats"><div><b>40+</b><span>позицій</span></div><div><b>4 типи</b><span>обробки</span></div><div><b>Україна</b><span>доставка</span></div><div><b>Опт / роздріб</b><span>окремі умови</span></div></div>
<section class="section alt"><div class="shell"><div class="sectionHead"><div><div class="ey">Категорії</div><h2>Одразу до продукції</h2></div><p>Каталог є головним інтерфейсом сайту. Людина з першого екрану переходить до потрібного типу каменю або виробу.</p></div><div class="cats">${['Колота бруківка','Пиляно-колота','Плити та плитка','Бордюри'].map((x,i)=>`<div class="cat"><div class="thumb"></div><div class="copy"><h3>${x}</h3><p>Каталог · фото · параметри · запит ціни</p></div></div>`).join('')}</div></div></section>
<section class="section"><div class="shell"><div class="sectionHead"><div><div class="ey">Каталог</div><h2>Популярні позиції</h2></div><p>Проста предметна подача без інтернет-магазинної перевантаженості. У розширених пакетах додаються фільтри, порівняння і CMS.</p></div><div class="products">${['Gabbro 10×10×5','Pokostivka 10×10×5','Пиляно-колота 10×10×5','Плита 60×30×3'].map((x,i)=>`<article class="product"><div class="thumb"></div><div class="copy"><h3>${x}</h3><p>Натуральний граніт · формат під проєкт</p><div class="prodFoot"><strong>від ___ грн</strong><span>Розрахувати →</span></div></div></article>`).join('')}</div></div></section>
<section class="section alt"><div class="shell"><div class="sectionHead"><div><div class="ey">Матеріали</div><h2>Камінь як система вибору</h2></div><p>У дорожчих варіантах клієнт може фільтрувати каталог за матеріалом, поверхнею, форматом і задачею.</p></div><div class="materials">${['Gabbro Black','Pokostivka Grey','Kapustyn Red','Light Granite'].map(x=>`<div class="material"><div class="sw"></div><b>${x}</b><p>Фактура · доступні формати · застосування</p></div>`).join('')}</div></div></section>
<section class="section"><div class="shell quote"><div><div class="ey">Прорахунок</div><h2>Потрібна ціна під ваш обсяг?</h2><p>Коротка форма збирає задачу і передає менеджеру контекст по товару, площі та типу клієнта.</p></div><div class="form"><div class="field">Імʼя</div><div class="field">Телефон</div><div class="field">Що цікавить?</div><div class="field">Орієнтовний обсяг</div><button class="send">Отримати розрахунок</button></div></div></section></div>`}
const concepts=[
{key:'700',cls:'v700',small:'01 · ближче до референсу',name:'Catalog Light',price:'$700',p:'Світлий зелений каталог з теплим жовтим акцентом. Багато продукції одразу, прості категорії та прямий шлях до заявки.',sub:'Натуральний камінь · прямі ціни виробника',h:'Гранітна бруківка та вироби з каменю',t:'Найпряміший варіант у логіці Gabro: клієнт одразу бачить продукцію, переходить у категорію і надсилає запит по конкретній позиції.'},
{key:'900',cls:'v900',small:'02 · каталог + бренд',name:'Catalog + CMS',price:'$900',p:'Той самий зрозумілий каталог, але з сильнішою візуальною системою, теплішою палітрою, фільтрами та керуванням контентом.',sub:'Камінь для приватних та комерційних просторів',h:'Матеріал, формат, поверхня — усе в одному каталозі.',t:'Більш виразний бренд і нормальний UX вибору: матеріали, категорії, фільтри та CMS для самостійного оновлення товарів.'},
{key:'1500',cls:'v1500',small:'03 · повна система',name:'Full System',price:'$1500',p:'Найсильніший варіант: каталог, матеріали, порівняння, B2B, проєкти, логістика, розширений розрахунок і CRM-контекст.',sub:'Виробник натурального каменю',h:'Каталог, що продає камінь як матеріал для проєкту.',t:'Повна система для виробника з широкою лінійкою: роздріб і B2B, фільтри, порівняння, кейси, SEO-структура та кваліфікована заявка.'}
];
const cards=document.getElementById('cards');
cards.innerHTML=concepts.map(c=>`<article class="card"><div class="preview"><div class="mini">${site(c.cls,c.name,c.price,c.sub,c.h,c.t)}</div></div><div class="meta"><small>${c.small}</small><div class="line"><h2>${c.name}</h2><div class="price">${c.price}</div></div><p>${c.p}</p><button class="open" onclick="openSite('${c.key}')">Відкрити концепт</button></div></article>`).join('');
function openSite(k){const c=concepts.find(x=>x.key===k);document.getElementById('full').innerHTML=site(c.cls,c.name,c.price,c.sub,c.h,c.t);document.getElementById('modalTitle').textContent=c.name+' · '+c.price;document.getElementById('modal').classList.add('on');document.body.style.overflow='hidden'}
function closeSite(){document.getElementById('modal').classList.remove('on');document.getElementById('full').innerHTML='';document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSite()});
</script></body></html>
