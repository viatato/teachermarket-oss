name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teachermarket
          POSTGRES_USER: teachermarket
          POSTGRES_PASSWORD: teachermarket
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U teachermarket -d teachermarket"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://teachermarket:teachermarket@localhost:5432/teachermarket
      TELEGRAM_BOT_TOKEN: "123456:replace_me"
      TELEGRAM_WEBHOOK_SECRET: replace_me
      JWT_SECRET: replace_with_long_random_secret_for_ci
      PAYMENT_WEBHOOK_SECRET: replace_me
      PAYMENT_PROVIDER: mock
      STORAGE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Run API tests
        working-directory: apps/api
        run: python -m unittest discover app/tests -v

  bot-smoke:
    name: Bot smoke
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://teachermarket:teachermarket@localhost:5432/teachermarket
      TELEGRAM_BOT_TOKEN: "123456:replace_me"
      TELEGRAM_WEBHOOK_SECRET: replace_me
      JWT_SECRET: replace_with_long_random_secret_for_ci
      PAYMENT_WEBHOOK_SECRET: replace_me
      PAYMENT_PROVIDER: mock
      STORAGE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bot
        working-directory: apps/bot
        run: pip install -e .
      - name: Compile bot
        working-directory: apps/bot
        run: python -m compileall bot

  webapp-build:
    name: Webapp build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/webapp/package-lock.json
      - name: Install webapp dependencies
        working-directory: apps/webapp
        run: npm ci
      - name: Build webapp
        working-directory: apps/webapp
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
